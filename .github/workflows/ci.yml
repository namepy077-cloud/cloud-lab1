name: New Docker CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f Dockerfile
          test -f index.html

      - name: Validate Docker build
        run: docker build -t my-web-image:test .
